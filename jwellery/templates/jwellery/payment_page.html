{% extends 'jwellery/base.html' %}
{% load static %}
{% block content %}

<style>
  body {
    background: radial-gradient(circle at top, #fff8e1, #fce8b2);
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
  }

  .payment-container {
    min-height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    text-align: center;
    padding: 20px;
  }

  .payment-card {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 20px;
    padding: 40px 30px;
    border: 2px solid #d4af37;
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.5);
    max-width: 500px;
    width: 100%;
    z-index: 2;
    animation: fadeIn 1s ease-in-out;
  }

  .payment-card h2 {
    font-family: 'Playfair Display', serif;
    color: #b88a1e;
    font-weight: 700;
    margin-bottom: 10px;
  }

  .payment-card p {
    color: #5c4a1c;
    font-size: 1rem;
    margin-bottom: 20px;
  }

  .btn-pay {
    display: inline-block;
    background: linear-gradient(135deg, #d4af37, #b88a1e);
    color: white;
    font-weight: 600;
    border: none;
    border-radius: 50px;
    padding: 12px 40px;
    font-size: 1.1rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
    animation: pulseGlow 2s infinite;
  }

  .btn-pay:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px rgba(212, 175, 55, 0.9);
  }

  /* Sparkle animation background */
  .sparkle {
    position: absolute;
    width: 5px;
    height: 5px;
    background: gold;
    border-radius: 50%;
    box-shadow: 0 0 10px gold, 0 0 20px #ffe57f;
    opacity: 0.9;
    animation: sparkleFloat 7s linear infinite;
  }

  @keyframes sparkleFloat {
    0% { transform: translateY(0) scale(1); opacity: 0.8; }
    50% { transform: translateY(-60px) scale(1.5); opacity: 0.6; }
    100% { transform: translateY(-120px) scale(0.8); opacity: 0; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 15px rgba(212, 175, 55, 0.6); }
    50% { box-shadow: 0 0 25px rgba(212, 175, 55, 1); }
  }
</style>

<div class="payment-container">
  <!-- Sparkles floating background -->
  {% for i in "123456789012345678901234" %}
  
  {% endfor %}

  <div class="payment-card">
    <img src="{% static 'images/gold.jpeg' %}" alt="JewelAura Logo" width="80" class="mb-3" />
    <h2>Secure Payment Portal</h2>
    <p>Complete your purchase securely with <strong>Razorpay</strong>.<br>
       Your exquisite jewellery awaits!</p>

    <form id="razorpay-form" method="POST" action="{% url 'jwellery:payment_success' %}">
      {% csrf_token %}
      <script
        src="https://checkout.razorpay.com/v1/checkout.js"
        data-key="{{ razorpay_key_id }}"
        data-amount="{{ amount }}"
        data-currency="{{ currency }}"
        data-order_id="{{ razorpay_order_id }}"
        data-buttontext="Pay Securely"
        data-name="JewelAura"
        data-description="Jewellery Purchase"
        data-image="{% static 'images/gold_logo.png' %}"
        data-prefill.name="{{ order.name }}"
        data-prefill.email="{{ order.email }}"
        data-theme.color="#d4af37">
      </script>

      <input type="hidden" name="razorpay_payment_id" id="razorpay_payment_id">
      <input type="hidden" name="razorpay_order_id" id="razorpay_order_id">
      <input type="hidden" name="razorpay_signature" id="razorpay_signature">

      <button type="button" id="pay-button" class="btn-pay mt-3">
        <i class="bi bi-gem me-2"></i> Proceed to Pay ₹{{ amount|floatformat:2 }}
      </button>
    </form>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function(){
    const payButton = document.getElementById('pay-button');

    payButton.addEventListener('click', function(){
      var options = {
        key: '{{ razorpay_key_id }}',
        amount: '{{ amount }}',
        currency: '{{ currency }}',
        name: 'JewelAura',
        description: 'Jewellery Purchase',
        order_id: '{{ razorpay_order_id }}',
        handler: function (response){
          document.getElementById('razorpay_payment_id').value = response.razorpay_payment_id;
          document.getElementById('razorpay_order_id').value = response.razorpay_order_id;
          document.getElementById('razorpay_signature').value = response.razorpay_signature;
          document.getElementById('razorpay-form').submit();
        },
        theme: { color: '#d4af37' }
      };

      var rzp = new Razorpay(options);
      rzp.open();
    });

    // Add sparkle animation dynamically
    const wrapper = document.querySelector(".payment-container");
    for (let i = 0; i < 20; i++) {
      const sparkle = document.createElement("div");
      sparkle.classList.add("sparkle");
      sparkle.style.left = Math.random() * 100 + "%";
      sparkle.style.top = Math.random() * 100 + "%";
      sparkle.style.animationDuration = (5 + Math.random() * 5) + "s";
      sparkle.style.animationDelay = (Math.random() * 5) + "s";
      wrapper.appendChild(sparkle);
    }
  });
</script>

{% endblock %}
